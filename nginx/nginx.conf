# When an HTTPS proxy (Caddy, docker-compose.prod.yml) sits in front, the
# TCP peer is the proxy, not the visitor. Trust X-Forwarded-For ONLY from
# private addresses (the proxy / Docker networks), so $remote_addr becomes
# the real visitor IP -- vote rate limits and shared-address detection need
# it. A visitor connecting directly has a public address and is never
# trusted, so the header can't be forged from the internet.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Keep "https" when the proxy terminated TLS (certificate links, redirects).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Submission file uploads (up to 50 MB per file, see services/files.py).
    # nginx's default is 1 MB, which would silently break every upload.
    client_max_body_size 60m;

    # Serve the built React app
    root /usr/share/nginx/html;
    index index.html;

    # Regular REST API calls -> backend container
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # WebSocket connections (live registration counter, announcements feed)
    # need the Upgrade/Connection headers explicitly forwarded, or the
    # connection silently falls back to failing — this is one of the
    # exact "invisible until you test it for real" bugs we're avoiding
    # by wiring this up in Step 1 instead of at the very end.
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # keep idle live-update sockets open
    }

    # React Router / client-side routing support: any unknown path
    # falls back to index.html instead of a raw Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
